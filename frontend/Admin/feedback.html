<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="feedback.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
        }

        /* Navigation Bar Style */
        .nav-bar {
            width: 100%;
            height: 60px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .nav-bar a {
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
        }

        .nav-bar a:hover {
            background-color: #444;
        }

        .header {
            margin-top: 80px; /* Adjusted to avoid overlap with nav bar */
            text-align: center;
        }

        .feedback-container {
            margin-top: 20px;
            padding: 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        button {
            padding: 6px 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin: 3px;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="admin.html">Update Menu</a>
        <a href="orders.html">Orders</a>
        <a href="feedback.html">Feedbacks</a>
    </div>

    <!-- Header Section -->
    <div class="header">
        <h1>User Feedback</h1>
    </div>

    <!-- Feedback Table Section -->
    <section class="feedback-container">
        <h2>Messages from Users</h2>
        <table id="feedback-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Feedback</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="feedback-list"></tbody>
        </table>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Quick Delicacies. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript for Handling Feedback -->
    <script>
        // Function to load feedback from the backend and display it in the table
        const loadFeedback = async () => {
            try {
                const response = await fetch('http://localhost:5000/Admin/feedback/data');
                const feedbackList = await response.json();

                const feedbackContainer = document.getElementById('feedback-list');
                feedbackContainer.innerHTML = ''; // Clear previous feedback before adding new ones

                // Loop through the feedback list and add each entry to the table
                feedbackList.forEach(item => {
                    const feedbackItem = document.createElement('tr');
                    feedbackItem.innerHTML = `
                        <td>${item.name}</td>
                        <td>${item.email}</td>
                        <td>${item.message}</td>
                        <td>
                            <button onclick="deleteFeedback('${item.id}')">Delete</button>
                            <button onclick="respondToFeedback('${item.id}')">Respond</button>
                        </td>
                    `;
                    feedbackContainer.appendChild(feedbackItem);
                });
            } catch (error) {
                console.error('Error loading feedback:', error);
            }
        };

        // Function to delete feedback by ID
        const deleteFeedback = async (id) => {
            if (confirm("Are you sure you want to delete this feedback?")) {
                try {
                    const response = await fetch(`http://localhost:5000/Admin/feedback/${id}`, {
                        method: 'DELETE',
                    });

                    if (response.ok) {
                        alert("Feedback deleted successfully!");
                        loadFeedback(); // Refresh the list after deletion
                    } else {
                        alert("Failed to delete feedback.");
                    }
                } catch (error) {
                    console.error('Error deleting feedback:', error);
                }
            }
        };

        // Function to respond to feedback (this could be further developed for real response handling)
        const respondToFeedback = (id) => {
            const response = prompt("Enter your response:");
            if (response) {
                alert(`Response sent for feedback ID ${id}: ${response}`);
            }
        };

        // Load feedback messages when the page loads
        window.onload = loadFeedback;
    </script>
</body>
</html>
