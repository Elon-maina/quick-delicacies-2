<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="nav-bar">
        <a href="admin.html">Update Menu</a>
        <a href="orders.html">Orders</a>
        <a href="feedback.html">Feedbacks</a>
    </div>
    <h1>All Orders</h1>
    <div id="orders-container"></div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchOrders();
        });
    
        function fetchOrders() {
            fetch("http://localhost:5000/api/orders")
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayOrders(data.orders);
                    } else {
                        document.getElementById("orders-container").innerHTML = "<p>No orders found.</p>";
                    }
                })
                .catch(error => {
                    console.error("Error fetching orders:", error);
                    document.getElementById("orders-container").innerHTML = "<p>Error loading orders.</p>";
                });
        }
    
        function displayOrders(orders) {
    const container = document.getElementById("orders-container");
    container.innerHTML = "";

        orders.forEach(order => {
            const orderDiv = document.createElement("div");
            orderDiv.classList.add("order");

            // Determine button properties based on order status
            const isDelivered = order.status === "Delivered";
            const buttonText = isDelivered ? "Delivered" : "Mark as Delivered";
            const buttonStyle = isDelivered ? "background-color: red; color: white; cursor: not-allowed;" : "";

            orderDiv.innerHTML = `
                <h2>Order #${order.id} - ${order.name}</h2>
                <p><strong>Email:</strong> ${order.email}</p>
                <p><strong>Phone:</strong> ${order.phone}</p>
                <p><strong>Residence:</strong> ${order.residence}, Room ${order.room}</p>
                <p><strong>Amount Paid:</strong> Ksh ${order.amountPaid}</p>
                <p><strong>MPesa Code:</strong> ${order.mpesaCode}</p>
                <p><strong>Status:</strong> ${order.status}</p>
                <h3>Items:</h3>
                <ul>
                    ${order.items.map(item => `<li>${item.itemName} - Ksh ${item.price} x ${item.quantity}</li>`).join("")}
                </ul>
                <button 
                    id="order-btn-${order.id}" 
                    onclick="updateOrderStatus(${order.id}, 'Delivered')"
                    ${isDelivered ? "disabled" : ""}
                    style="${buttonStyle}"
                >
                    ${buttonText}
                </button>
            `;
            container.appendChild(orderDiv);
        });
    }
  
        function updateOrderStatus(orderId, status) {
        fetch(`http://localhost:5000/api/orders/${orderId}/status`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ status })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                Swal.fire({
                    icon: "success",
                    title: "Order Updated",
                    text: "Order status updated successfully!",
                    showConfirmButton: false,
                    timer: 2500
                });

                fetchOrders(); // Refresh orders
            } else {
                Swal.fire({
                    icon: "error",
                    title: "Update Failed",
                    text: data.message || "Failed to update order status.",
                    showConfirmButton: true
                });
            }
        })
        .catch(error => {
            console.error("Error updating order status:", error);
            Swal.fire({
                icon: "error",
                title: "Error",
                text: "Something went wrong. Try again.",
                showConfirmButton: true
            });
        });
    }
        </script>
    
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #fff;
    text-align: center;
    padding: 20px;
    margin: 0;
    padding: 0;
}
.nav-bar{
    width: 100%;
    height: 80px;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: space-around;
    position: fixed;
    top: 0;
}
.nav-bar a{
    color: #ffffff;
    text-decoration: none;
}
.order {
        border: 1px solid #000;
        padding: 15px;
        margin: 10px;
        background: #f9f9f9;
        color: black;
    }
.order button {
        background: rgba(0, 121, 30, 0.896);
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
    }
.order button:hover{
    transform: scale(1.05);
    }
/* Responsive */
@media (max-width: 400px) {
    form {
        width: 90%;
    }
}
    </style>
</body>
</html>
