<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Shopping Cart</h1>
    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-items">
            <!-- Items will be inserted here dynamically -->
        </tbody>
    </table>
    <h2>Total: Ksh <span id="total-price">0</span></h2>
    <button id="complete-order">Complete Order</button>
    <style>
        body {
    background-color: #ffffff;
    text-align: center;
    margin: 0;
    padding: 0;
    }
    </style>
</body>
</html>
