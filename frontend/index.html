<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color: #333;
}

/* General header bar */
.header {
    background-color: #f3bf91;
    font-weight: 500;
    width: 100%;
    position: fixed;
    height: 140px;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 90px;
}
h1 {
    padding-top: 150px;
    padding: 70px;
    margin: 0;
    font-size: 2.5em;
    font-weight: bold;
}

.search-container {
    position: fixed;
    top: 150px;
    left: 50%;
    transform: translateX(-50%); 
    display: flex;
    align-items: center;
    justify-content: center; 
    background: white;
    padding: 10px; 
    border-radius: 20px;
    width: 80%;
    max-width: 400px; 
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    z-index: 100;
}

/* Adjustments for smaller screens */
@media screen and (max-width: 768px) {
    .search-container {
        top: 120px;
        width: 90%; 
        padding: 8px; 
    }
}

@media screen and (max-width: 480px) {
    .search-container {
        top: 100px;
        width: 95%; 
        padding: 5px; 
    }
}



        #search-input {
            border: none;
            outline: none;
            padding: 5px;
            width: 100%;
        }

        .search-container i {
            color: gray;
            margin-left: 5px;
            cursor: pointer;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        /* Modal Content */
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        /* Close Button */
        #modal-close {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #modal-close:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="header">
        <h2>QUICK DELICACIES</h2>
        <a href="cart.html" class="cart-icon">
            <div class="cart-counter" id="cart-counter">0</div>
            <i class="fas fa-shopping-cart"></i>
        </a>
    </div>

    <!-- Sidebar Navigation -->
    <label>
        <input class="checkbox" type="checkbox">
        <div class="toggle">
            <span class="top-line common"></span>
            <span class="mid-line common"></span>
            <span class="bottom-line common"></span>
        </div>
        <div class="home">
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="index.html">Menu</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><button class="logout" onclick="logout()">Logout</button></li>
                </ul>
            </nav>
        </div>
    </label>

    <!-- Search Bar (Top Right) -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search food...">
        <i class="fas fa-search" id="search-icon"></i>
    </div>

    <!-- Menu Section -->
    <div id="menu-container">
        <div id="menu"></div>
        <div id="search-results" class="menu"></div>
    </div>

    <div class="whatsapp-icon">
        <a href="https://wa.me/254797328901?text=Hello%20Quick%20Delicacies!" target="_blank" aria-label="Chat on WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>
    <footer>
        <p>&copy; 2025 Quick Delicacies. All Rights Reserved.</p>
        <div class="social-icons">
            <a href="https://wa.me/254797328901?text=Hello%20Quick%20Delicacies!" target="_blank" class="icon whatsapp" aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://facebook.com/" target="_blank" class="icon facebook" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://twitter.com/" target="_blank" class="icon twitter" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="https://youtube.com/" target="_blank" class="icon youtube" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </footer>

    <!-- Custom Modal -->
    <div id="custom-modal" class="modal">
        <div class="modal-content">
            <span id="modal-message"></span><br>
            <button id="modal-close">Close</button>
        </div>
    </div>

    <script>
    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        window.location.href = "login.html";
    }

    // Add event listeners for both input and icon
    document.getElementById('search-icon').addEventListener('click', performSearch);
    document.getElementById('search-input').addEventListener('input', performSearch);

    // Debounce function to limit API calls
    let searchTimeout;
    function performSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = document.getElementById('search-input').value.trim();
        const searchResultsContainer = document.getElementById('search-results');

        if (query) {
            fetch(`/menu/search?query=${encodeURIComponent(query)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    searchResultsContainer.innerHTML = ''; // Clear current search results
                    if (data.length === 0) {
                        searchResultsContainer.innerHTML = '<p>No items found</p>';
                    } else {
                        data.forEach(item => {
                            searchResultsContainer.innerHTML += `
                                <div class="menu-item">
                                    <img src="${item.image}" alt="${item.name}">
                                    <h3>${item.name}</h3>
                                    <p class="price">$${item.price}</p>
                                    <button class="add-to-cart" 
                                        data-id="${item.id}"
                                        data-name="${item.name}"
                                        data-price="${item.price}">
                                        Add to Cart
                                    </button>
                                </div>
                            `;
                        });
                    }
                })
                .catch(error => {
                    console.error('Search Error:', error);
                    searchResultsContainer.innerHTML = '';
                });
        } else {
            searchResultsContainer.innerHTML = ''; // Clear results when input is empty
        }
    }, 300); // 300ms delay
}
    </script>
    <script src="script.js"></script>
</body>

</html>
