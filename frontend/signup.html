<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup</title>
</head>
<body>
    <h2>Signup</h2>
    <form id="signup-form">
        <input type="text" id="name" placeholder="Name" required><br>
        <input type="email" id="email" placeholder="Email" required><br>

        <div class="input-container">
            <input type="password" id="password" placeholder="Password" required>
            <span class="toggle-password" id="eye1" onclick="togglePassword('password', 'eye1')">show</span>
        </div>

        <div class="input-container">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <span class="toggle-password" id="eye2" onclick="togglePassword('confirmPassword', 'eye2')">show</span>
        </div>

        <button type="submit">Signup</button>
    </form>
    
    <p>Already have an account? <a href="login.html">Login</a></p>

    <!-- Error message display -->
    <div id="error-message" style="display: none; color: red; margin-top: 10px;"></div>
    
    <!-- Success message display -->
    <div id="success-message" style="display: none; color: green; margin-top: 10px;"></div>

    <script>
        function togglePassword(inputId, eyeId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeId);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerText = "hide";
            } else {
                passwordInput.type = "password";
                eyeIcon.innerText = "show";
            }
        }

        document.getElementById("signup-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            const errorMessage = document.getElementById("error-message");
            const successMessage = document.getElementById("success-message");

            // Reset messages
            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            // Check if passwords match
            if (password !== confirmPassword) {
                errorMessage.innerText = "Passwords do not match!";
                errorMessage.style.display = "block";
                return;
            }

            // Password validation rules
            const errors = [];
            if (password.length < 8) errors.push("at least 8 characters long");
            if (!/[a-z]/.test(password)) errors.push("at least one lowercase letter");
            if (!/[A-Z]/.test(password)) errors.push("at least one uppercase letter");
            if (!/[0-9]/.test(password)) errors.push("at least one number");
            if (!/[\W_]/.test(password)) errors.push("at least one special character (!@#$%^&*)");

            // Show error message if password is weak
            if (errors.length > 0) {
                errorMessage.innerText = "Password must contain " + errors.join(", ") + ".";
                errorMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password, confirmPassword }),
                    credentials: "include"
                });

                const result = await response.json();

                if (!response.ok) {
                    errorMessage.innerText = result.error || "Signup failed. Please try again.";
                    errorMessage.style.display = "block";
                } else {
                    successMessage.innerText = "Signup successful! Redirecting to login...";
                    successMessage.style.display = "block";

                    // Wait 2 seconds before redirecting
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                }
            } catch (error) {
                console.error("Signup Error:", error);
                errorMessage.innerText = "Signup failed. Please try again.";
                errorMessage.style.display = "block";
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        form {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 26px;
            color: #000000;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #f8f7f7;
            color: #000000;
            outline: none;
            padding-right: 40px;
        }
        .input-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            color: #000000;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ff9800;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff5722;
        }
        p {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            color: #000;
        }
        a {
            color: #0400ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        #error-message, #success-message {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</body>
</html>
