<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Include SweetAlert -->
</head>
<body>
    <h2>Reset Password</h2>
    <form id="reset-password-form">
        <div class="input-container">
            <input type="password" id="new-password" placeholder="Enter new password" required>
            <span class="toggle-password" id="eye1" onclick="togglePassword('new-password', 'eye1')">show</span>
        </div>
        <p id="password-error" class="error-message"></p>

        <div class="input-container">
            <input type="password" id="confirm-password" placeholder="Confirm new password" required>
            <span class="toggle-password" id="eye2" onclick="togglePassword('confirm-password', 'eye2')">show</span>
        </div>

        <button type="submit">Reset Password</button>
    </form>

    <p><a href="login.html">Back to Login</a></p>

    <div id="error-message" class="error-message"></div>

    <script>
        function togglePassword(inputId, eyeId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeId);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerText = "hide";
            } else {
                passwordInput.type = "password";
                eyeIcon.innerText = "show";
            }
        }

        document.getElementById("reset-password-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get("email");
            const code = urlParams.get("code");
            const newPassword = document.getElementById("new-password").value.trim();
            const confirmPassword = document.getElementById("confirm-password").value.trim();
            const passwordError = document.getElementById("error-message");
            const errorMessage = document.getElementById("error-message");

            passwordError.style.display = "none";
            errorMessage.style.display = "none";

            if (!email || !code) {
                errorMessage.innerText = "Invalid request. Please restart the reset process.";
                errorMessage.style.display = "block";
                return;
            }

            // Password validation rules
            const errors = [];
            if (newPassword.length < 8) errors.push("at least 8 characters long");
            if (!/[a-z]/.test(newPassword)) errors.push("at least one lowercase letter");
            if (!/[A-Z]/.test(newPassword)) errors.push("at least one uppercase letter");
            if (!/[0-9]/.test(newPassword)) errors.push("at least one number");
            if (!/[\W_]/.test(newPassword)) errors.push("at least one special character (!@#$%^&*)");

            if (errors.length > 0) {
                passwordError.innerText = "Password must contain " + errors.join(", ") + ".";
                passwordError.style.display = "block";
                return;
            }

            if (newPassword !== confirmPassword) {
                errorMessage.innerText = "Passwords do not match!";
                errorMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, code, newPassword })
                });

                const result = await response.json();

                if (!response.ok) {
                    errorMessage.innerText = result.error || "Reset failed. Please try again.";
                    errorMessage.style.display = "block";
                } else {
                    Swal.fire({
                        icon: "success",
                        title: "Password Reset Successful",
                        text: result.message,
                        timer: 3000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = "login.html";
                    });
                }
            } catch (error) {
                errorMessage.innerText = "Something went wrong. Please try again.";
                errorMessage.style.display = "block";
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        form {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 26px;
            color: #000000;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #f8f7f7;
            color: #000000;
            outline: none;
            padding-right: 40px;
        }
        .input-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            color: #000000;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ff9800;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff5722;
        }
        p {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            color: #000;
        }
        a {
            color: #0400ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .error-message {
            font-size: 14px;
            font-weight: bold;
            color: red;
            display: none;
        }
    </style>

</body>
</html>
